<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EEE9FB" />
    <title>Oila reestri</title>
    <link rel="icon" href="/favicon.svg" />
    <script>
      /* Sahifa chizilishidan oldin rejimni qo'yamiz: oq-qora "yalt" etib o'zgarmasin */
      try { var t = localStorage.getItem('oila-reestri-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
